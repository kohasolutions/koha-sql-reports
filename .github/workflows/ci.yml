name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reports:
    name: Koha's save rules, layout, index
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/lint.mjs
      - run: node tools/build-index.mjs --check
      - name: Company introduction matches github.com/kohasolutions/.github/company/about.md
        run: node tools/sync-about.mjs --check

  schema:
    name: Columns exist in Koha ${{ matrix.koha }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The latest release of each Koha series the reports are checked against. Update when Koha releases.
        koha: [v23.11.15-1, v24.05.16-1, v24.11.21-1, v25.05.16-1, v25.11.10-1, v26.05.05-1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch kohastructure.sql for ${{ matrix.koha }}
        run: curl -fsSL -o kohastructure.sql "https://raw.githubusercontent.com/Koha-Community/Koha/${{ matrix.koha }}/installer/data/mysql/kohastructure.sql"
      - run: KOHASTRUCTURE=kohastructure.sql node tools/lint.mjs

  secrets:
    name: No secrets committed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks program itself (MIT), pinned and checksum-verified. The gitleaks GitHub Action needs a paid
      # licence for organisations; the scanner does not.
      - name: Scan the whole history for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose
